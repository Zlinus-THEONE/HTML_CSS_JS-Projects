<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roll a dice!</title>

    <link href="https://fonts.googleapis.com/css?family=Goldman:regular,700" rel="stylesheet" />

    <link rel="stylesheet" href="style.css">
</head>
<body> 

    <h1>Dice Table</h1>

   <div id="content-box">
     <div id="user-input-box">    
        <div id="dice-circle-forH2">
             <h2 id="dice-value-h2">1</h2>
        </div>
        <button id="Add-dice-but">Add Dice (+) </button>
        <button id="Remove-dice-but">Remove Dice (-) </button>
        <button id="Generate-dice-but">Generate (?) </button>
     </div>


     <div id="dice-img-box">
        <img id="dice-number-one" class="dice-images" src="Assets/Dice1.png" alt="Dice Number 1" data-dice="1" data-value="1">
        <img class="dice-images" src="Assets/Dice0.png" alt="Dice Number 0" data-dice="2" data-value="0">
        <img class="dice-images" src="Assets/Dice0.png" alt="Dice Number 0" data-dice="3" data-value="0">
        <img class="dice-images" src="Assets/Dice0.png" alt="Dice Number 0" data-dice="4" data-value="0">
        <img class="dice-images" src="Assets/Dice0.png" alt="Dice Number 0" data-dice="5" data-value="0">
        <img class="dice-images" src="Assets/Dice0.png" alt="Dice Number 0" data-dice="6" data-value="0">
          
     </div>
    </div>
        


    <script src="script.js"></script>
    
</body>
</html>
