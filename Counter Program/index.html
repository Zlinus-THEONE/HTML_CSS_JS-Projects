<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Counter Program</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <br />
    <div id="content-box">
      <h1>Welcome to the Counter Program</h1>
      <br />

      <h2 id="count-text">0</h2>

      <br />
      <div id="button-box">
        <button class="button" value="d2"><h3>/ 2</h3></button>
        <button class="button" value="-1"><h3>Decrease</h3></button>
        <button class="button" value="0"><h3>RESET</h3></button>
        <button class="button" value="1"><h3>Increase</h3></button>
        <button class="button" value="x2"><h3>x 2</h3></button>
      </div>

      <br />

      <h3 id="info-text">0 is 0</h3>
    </div>

    <script src="script.js"></script>
  </body>
</html>
